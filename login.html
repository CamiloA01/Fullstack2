<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Inicio de Sesión - Rent a House</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>

    <header>
        <a href="index.html" id="nombre-pag">Rent a House</a>
        <nav id="nav-header">
        <ul>
            <li><a href="#">Contacto</a></li>
            <li id="item-usuario" style="display: none;"> <span id="texto-usuario"></span></li>
            <li><a href="login.html" id="btn-inicio-sesion">Inicio de sesion</a></li>
        </ul>
        </nav>
    </header>

    <main>
        <section id="contenedor-login">
            <div class="caja-login">
                <h2>Iniciar Sesión</h2>
                <p class="subtitulo-login">Acceso exclusivo para Ejecutivos y Administradores</p>
                
                <form id="form-login">
                    <div class="campo">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" placeholder="ejecutivo@rentahouse.cl" required>
                    </div>

                    <div class="campo">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" placeholder="********" minlength="8" required>
                    </div>

                    <button id="btn-ingresar">Ingresar</button>
                </form>

                <div class="enlaces-login">
                    <a href="index.html">&larr; Volver al catálogo de propiedades</a>
                </div>
            </div>
        </section>
    </main>

    <script src="login-script.js"></script>

    </body>
</html>
